# LLM-only recovery proposer. Transport params come from the model-endpoint
# card through mount_params; model/decode identity enters preregistration.
needs_sim = false
[mounts."reasoner.proposer"]
ref = "plugins.reasoner:provider"
params = { endpoint = "plugins.model_endpoint:provider", attempts = 2, max_tokens = 2048, temperature = 0.0, seed = 0 }
