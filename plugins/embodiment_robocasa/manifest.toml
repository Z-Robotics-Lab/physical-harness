# The RoboCasa embodiment card: a SECOND simulator behind the same two seams the
# robosuite card owns (embodiment.env + percept.model). It rides a separate venv
# (sims/robocasa-venv: robocasa 1.0.1 + robosuite master + numpy 2.x) and a
# separate resident runtime -- the base is sim-agnostic, so a sim is just a card.
#
# enabled = false -> installed but INACTIVE. It re-claims embodiment.env and
# percept.model, which plugins/embodiment_robosuite already owns, so discover()
# keeps it OUT of the folded base plan (the base_profile sha is untouched) while
# plugin_doctor still checks it at this path (card_mounts reads the file directly,
# ignoring enabled). Its runtime activation is a session choice
# (docs/project-documentation.md §5.2), not a base edit: the robocasa runtime mounts this card, session-main never does.
enabled = false

actuation = "sim"
needs_sim = true
# The third-party surface no OTHER card may import (test_boundaries reads this;
# an rsi/policies module reaching for robocasa would be an embodiment leak).
# discover() records third_party even for a disabled card -- its .py files still
# sit in plugins/ and the boundary AST test scans them regardless of enabled.
third_party = ["robocasa", "robosuite", "mujoco"]

[mounts."embodiment.env"]
ref = "plugins.embodiment_robocasa:provider"

[mounts."percept.model"]
ref = "plugins.embodiment_robocasa.percept:provider"

# Repair shapes this card owns, folded by harness.manifest.discover() and
# isinstance-checked against harness.contracts.RecoveryStrategy at load. They
# speak the kitchen phase vocabulary and are executed by this card's
# RobocasaRecoveryActor, never the tabletop one.
[recoveries.regrasp_kitchen]
ref = "plugins.embodiment_robocasa.recoveries:REGRASP_KITCHEN"

[recoveries.redock_retry]
ref = "plugins.embodiment_robocasa.recoveries:REDOCK_RETRY"

# Reach repairs a planner may insert as a recovery node after a reach_stall:
# lift to hover and re-descend on the live target / nudge the base <= nudge_max
# toward it / open, lift, hover (see recoveries.py).
[recoveries.reapproach]
ref = "plugins.embodiment_robocasa.recoveries:REAPPROACH"

[recoveries.base_nudge]
ref = "plugins.embodiment_robocasa.recoveries:BASE_NUDGE"

[recoveries.release_reset]
ref = "plugins.embodiment_robocasa.recoveries:RELEASE_RESET"

# Stage-driver knobs (drivers.tunables()): defaults here, overlaid per process by
# PH_TUNABLES='{"key": value}' (unknown keys refuse). drivers.tunables_sha() rides
# every segment's diagnostics. This is the axis the RSI light loop perturbs.
[tunables]
hover_dz = 0.08      # GraspDriver hover height above the object (m)
reach_tol = 0.03     # xy arrival gate at hover / over the drop point (m)
standoff = 0.65      # GraspDriver base standoff at the work height (m)
segment_cap = 0      # per-segment step cap; 0 = the mission's stage table
stall_k = 40         # StallDetector: steps without progress (eef->target: reach_stall;
                     # base->dock on any nav leg: nav_stall)
drop_over_dz = 0.12  # PointPlaceDriver: "over" height above the drop point (m)
drop_edge_margin = 0.10  # ClusterDropDriver: past the stove bbox edge, toward the counter (m)
drop_spread = 0.07   # ClusterDropDriver: per-can lateral pitch along the stove edge (m)
drop_dz = 0.05       # ClusterDropDriver: release height above the stove-top plane (m)
carry_stop = 0.65    # NavigateDriver loaded leg: stop this far from the dock; the place
                     # stage's arm covers the rest (m) -- the base-reach knob
nudge_max = 0.15     # base_nudge recovery: base travel bound toward the target (m)

# failure_mode -> the tunables evolve's proposer perturbs FIRST for a first death
# in that mode (manifest.mount_params hands it to the proposer as
# params["tunable_hints"]); knobs not listed follow, in name order.
[tunable_hints]
reach_stall = ["carry_stop", "nudge_max", "drop_edge_margin", "drop_over_dz", "standoff", "hover_dz", "reach_tol"]
nav_stall = ["carry_stop", "stall_k"]

