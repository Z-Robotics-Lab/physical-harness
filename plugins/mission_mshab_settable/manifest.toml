# The mshab VLM-planned chain mission: {"kind":"task","task":"mshab_settable_vlm"}
# on session-mshab. The VLM designs the GRAPH (skill selection, order, REQUIRES
# edges, verify coverage) from scene facts; the grounding (scene, targets, goal
# poses) is a slice of an OFFICIAL set_table sequential TaskPlan baked into the
# chain env (embodiment_mshab TASKS["mshab_settable_chain"]), and the env's own
# subtask order is the authority -- a graph in a physically wrong order fails
# at the mismatched segment and folds back into replan.
#
# No [mounts.*]; every cross-card reach is by ref (basket_smoke_vlm verbatim).
# The planner ref is this card's thin provider wrapping planner_vlm with the
# LOCAL sglang endpoint (the DeepSeek default has no balance on this machine).
needs_sim = true

# The FULL official episode (sequential plan 0, all 16 subtasks): bowl out of
# the kitchen drawer, apple out of the fridge, both to the table, both
# containers closed. Doubled graph, close skill unlocked, doubled token
# budget for the plan JSON.
[task_bindings.mshab_settable_full_vlm]
env = "plugins.embodiment_mshab:provider"
policy = "plugins.embodiment_mshab.drivers:chain_provider"
planner = "plugins.mission_mshab_settable.planner:provider_full"
catalogue = "plugins.mission_mshab_settable.planner:CATALOGUE_FULL"
oracles = "plugins.mission_mshab_settable.planner:ORACLES"
skill_docs = "plugins.mission_mshab_settable.planner:SKILL_DOCS_FULL"
planning_context = "plugins.mission_mshab_settable.planner:PLANNING_CONTEXT_FULL"
default_instruction = "plugins.mission_mshab_settable.planner:DEFAULT_INSTRUCTION_FULL"
episodic = true
episode = "plugins.mission_mshab_settable.planner:EPISODE_FULL"
segment_specs = "plugins.mission_mshab_settable.planner:SEGMENT_SPECS_FULL"
max_actuations = 40
# place is a ~60%-per-attempt policy even from native docks; retries rotate
# the dock row, so 4 attempts puts the segment at ~97% -- and the replan
# governor rightly refuses a same-graph replan, so in-segment retries are
# where the odds have to come from.
segment_retries = 3

[task_bindings.mshab_settable_vlm]
env = "plugins.embodiment_mshab:provider"
policy = "plugins.embodiment_mshab.drivers:chain_provider"
planner = "plugins.mission_mshab_settable.planner:provider"
catalogue = "plugins.mission_mshab_settable.planner:CATALOGUE"
oracles = "plugins.mission_mshab_settable.planner:ORACLES"
skill_docs = "plugins.mission_mshab_settable.planner:SKILL_DOCS"
planning_context = "plugins.mission_mshab_settable.planner:PLANNING_CONTEXT"
default_instruction = "plugins.mission_mshab_settable.planner:DEFAULT_INSTRUCTION"
episodic = true
episode = "plugins.mission_mshab_settable.planner:EPISODE"
segment_specs = "plugins.mission_mshab_settable.planner:SEGMENT_SPECS"
max_actuations = 16
segment_retries = 3
